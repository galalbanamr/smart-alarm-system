<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Smart Morning Routine - Register</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#10b77f",
                        "background-light": "#f6f8f7",
                        "background-dark": "#0f0f1e", // Deep Navy per request
                        "surface-dark": "#11221c",
                        "emerald-dark": "#064e3b",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        "DEFAULT": "0.375rem", // rounded-md approx
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    backgroundImage: {
                        'cyber-gradient': 'linear-gradient(135deg, #0f0f1e 0%, #064e3b 100%)',
                        'glass': 'linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%)'
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(16, 183, 127, 0.1);
        }

        .neon-text {
            text-shadow: 0 0 10px rgba(16, 183, 127, 0.5);
        }

        .input-glow:focus {
            box-shadow: 0 0 0 1px #10b77f, 0 0 8px rgba(16, 183, 127, 0.3);
        }

        /* Subtle grid background pattern */
        .cyber-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-background-dark text-white min-h-screen flex flex-col relative overflow-x-hidden font-display selection:bg-primary selection:text-background-dark">
<!-- Background Elements -->
<div class="fixed inset-0 z-0 bg-cyber-gradient"></div>
<div class="fixed inset-0 z-0 cyber-grid"></div>
<!-- Ambient glow orbs -->
<div class="fixed top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/20 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-[#0f0f1e] rounded-full blur-[100px]"></div>
<div class="absolute top-[40%] right-[20%] w-[30%] h-[30%] bg-primary/10 rounded-full blur-[80px]"></div>
</div>
<!-- Main Layout -->
<div class="relative z-10 flex min-h-screen w-full flex-col items-center justify-center p-4 sm:p-6 lg:p-8">
<!-- Navbar Minimal -->
<header class="absolute top-0 left-0 right-0 flex items-center justify-between px-6 py-6 md:px-12">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center size-10 rounded-lg bg-primary/10 border border-primary/20 text-primary">
<span class="material-symbols-outlined text-2xl">rocket_launch</span>
</div>
<h1 class="text-xl font-bold tracking-tight text-white hidden sm:block">Smart Routine</h1>
</div>
<a class="text-sm font-medium text-gray-400 hover:text-primary transition-colors duration-200" href="#">Help Center</a>
</header>
<!-- Registration Card -->
<div class="glass-card w-full max-w-[480px] rounded-xl p-8 sm:p-10 flex flex-col gap-8 animate-fade-in-up">
<!-- Header -->
<div class="flex flex-col gap-2 text-center">
<h2 class="text-3xl font-black tracking-tight text-white neon-text">Initialize Routine</h2>
<p class="text-gray-400 text-sm font-medium">Upgrade your mornings. Select your role to begin.</p>
</div>
<!-- Role Selector (Segmented Button) -->
<div class="w-full">
<div class="relative flex w-full p-1 bg-[#0f0f1e]/50 rounded-lg border border-white/5">
<label class="flex-1 text-center cursor-pointer relative z-10">
<input checked="" class="peer sr-only" name="role" type="radio" value="parent"/>
<div class="py-2.5 px-4 rounded-md text-sm font-semibold text-gray-400 transition-all duration-300 peer-checked:text-background-dark peer-checked:bg-primary peer-checked:shadow-[0_0_15px_rgba(16,183,127,0.4)]">
                            Parent Mode
                        </div>
</label>
<label class="flex-1 text-center cursor-pointer relative z-10">
<input class="peer sr-only" name="role" type="radio" value="child"/>
<div class="py-2.5 px-4 rounded-md text-sm font-semibold text-gray-400 transition-all duration-300 peer-checked:text-background-dark peer-checked:bg-primary peer-checked:shadow-[0_0_15px_rgba(16,183,127,0.4)]">
                            Child Mode
                        </div>
</label>
</div>
</div>
<!-- Form -->
<form class="flex flex-col gap-5">
<!-- Email Input -->
<div class="space-y-1.5">
<label class="text-xs font-bold text-gray-300 uppercase tracking-wider ml-1">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-gray-500 group-focus-within:text-primary transition-colors">mail</span>
</div>
<input class="w-full bg-[#0f0f1e]/60 border border-white/10 text-white text-sm rounded-lg block pl-10 p-3.5 placeholder-gray-500 focus:outline-none focus:border-primary input-glow transition-all duration-200" placeholder="Enter your email" type="email"/>
</div>
</div>
<!-- Username Input (Gamified) -->
<div class="space-y-1.5">
<label class="text-xs font-bold text-gray-300 uppercase tracking-wider ml-1">Codename (Username)</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-gray-500 group-focus-within:text-primary transition-colors">badge</span>
</div>
<input class="w-full bg-[#0f0f1e]/60 border border-white/10 text-white text-sm rounded-lg block pl-10 p-3.5 placeholder-gray-500 focus:outline-none focus:border-primary input-glow transition-all duration-200" placeholder="Choose your alias" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-1.5">
<label class="text-xs font-bold text-gray-300 uppercase tracking-wider ml-1">Password</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-gray-500 group-focus-within:text-primary transition-colors">lock</span>
</div>
<input class="w-full bg-[#0f0f1e]/60 border border-white/10 text-white text-sm rounded-lg block pl-10 p-3.5 placeholder-gray-500 focus:outline-none focus:border-primary input-glow transition-all duration-200" placeholder="Create a secure key" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="mt-2 w-full bg-primary hover:bg-[#0ea06f] text-background-dark font-bold py-3.5 px-4 rounded-lg transition-all duration-200 shadow-[0_0_20px_rgba(16,183,127,0.3)] hover:shadow-[0_0_25px_rgba(16,183,127,0.5)] transform hover:-translate-y-0.5 flex items-center justify-center gap-2 group" type="button">
<span>Start System</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform text-lg">arrow_forward</span>
</button>
<!-- Terms -->
<p class="text-xs text-center text-gray-500 px-4 leading-relaxed">
                    By accessing the system, you agree to our <a class="text-primary hover:underline" href="#">Terms of Service</a> and <a class="text-primary hover:underline" href="#">Privacy Protocols</a>.
                </p>
</form>
<!-- Divider -->
<div class="relative flex py-1 items-center">
<div class="flex-grow border-t border-white/10"></div>
<span class="flex-shrink-0 mx-4 text-gray-500 text-xs font-medium uppercase tracking-widest">Or Access With</span>
<div class="flex-grow border-t border-white/10"></div>
</div>
<!-- Social Login -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 bg-[#0f0f1e]/80 border border-white/10 hover:border-white/30 hover:bg-white/5 text-white py-2.5 px-4 rounded-lg transition-all duration-200 group" type="button">
<svg aria-hidden="true" class="w-5 h-5 text-white group-hover:scale-110 transition-transform" fill="currentColor" viewbox="0 0 24 24"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"></path></svg>
<span class="text-sm font-medium">Google</span>
</button>
<button class="flex items-center justify-center gap-2 bg-[#0f0f1e]/80 border border-white/10 hover:border-white/30 hover:bg-white/5 text-white py-2.5 px-4 rounded-lg transition-all duration-200 group" type="button">
<svg aria-hidden="true" class="w-5 h-5 text-white group-hover:scale-110 transition-transform" fill="currentColor" viewbox="0 0 24 24"><path d="M13.135 6H15V3h-1.865a4.147 4.147 0 00-4.142 4.142V9H7v3h2v9.938h3V12h2.021l.592-3H12V6.591A.6.6 0 0112.608 6a.6.6 0 01.527 0z"></path></svg>
<span class="text-sm font-medium">Facebook</span>
</button>
</div>
<!-- Login Link -->
<div class="text-center mt-2">
<p class="text-sm text-gray-400">Already in the database? <a class="text-primary font-bold hover:text-white transition-colors ml-1" href="#">Log in</a></p>
</div>
</div>
</div>
</body></html>
