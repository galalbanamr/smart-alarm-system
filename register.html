<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Standing Detection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth-styles.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-title">
                    <span class="auth-icon">👁️</span>
                    Create Account
                </h1>
                <p class="auth-subtitle">Join Standing Detection System</p>
            </div>

            <form id="registerForm" class="auth-form" style="display: flex;">
                <div class="form-group">
                    <label for="regName">Full Name</label>
                    <input type="text" id="regName" name="name" required>
                </div>

                <div class="form-group">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" name="username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" name="password" required autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="regRole">Account Type</label>
                    <select id="regRole" name="role" required>
                        <option value="parent">Parent</option>
                        <option value="child">Child</option>
                    </select>
                </div>

                <!-- Father Name field (only shown for children) -->
                <div class="form-group" id="fatherNameGroup" style="display: none;">
                    <label for="regFatherName">Father's Name</label>
                    <input type="text" id="regFatherName" name="fatherName" placeholder="Enter your father's full name">
                    <small class="form-hint">This connects you to your parent's account</small>
                </div>

                <div id="errorMessage" class="error-message"></div>
                <div id="successMessage" class="success-message"></div>

                <button type="submit" class="auth-button">
                    <span>Create Account</span>
                    <span class="button-icon">✓</span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html" class="auth-link">Login</a></p>
            </div>
        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/auth-pages.js"></script>
</body>
</html>
