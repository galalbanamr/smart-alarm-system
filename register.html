<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Register - Waking Up</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Theme Config -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#10b77f",
                        "background-light": "#f6f8f7",
                        "background-dark": "#0f0f1e", // Deep Navy per request
                        "surface-dark": "#11221c",
                        "emerald-dark": "#064e3b",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        "DEFAULT": "0.375rem", // rounded-md approx
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    backgroundImage: {
                        'cyber-gradient': 'linear-gradient(135deg, #0f0f1e 0%, #064e3b 100%)',
                        'glass': 'linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%)'
                    }
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(16, 183, 127, 0.1);
        }

        .neon-text {
            text-shadow: 0 0 10px rgba(16, 183, 127, 0.5);
        }

        .input-glow:focus {
            box-shadow: 0 0 0 1px #10b77f, 0 0 8px rgba(16, 183, 127, 0.3);
        }

        /* Subtle grid background pattern */
        .cyber-grid {
            background-size: 40px 40px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        /* Responsive Styles */

        /* Mobile phones */
        @media (max-width: 640px) {

            /* Compact main layout */
            [class*="flex"][class*="min-h-screen"] {
                padding: 8px !important;
                padding-top: 60px !important;
            }

            /* Smaller header */
            header {
                padding: 12px !important;
            }

            header h1 {
                display: none !important;
            }

            header [class*="size-10"] {
                width: 32px !important;
                height: 32px !important;
            }

            /* Compact card */
            .glass-card {
                padding: 20px 16px !important;
                margin: 0 4px;
                max-width: 100% !important;
                gap: 16px !important;
            }

            .glass-card h2,
            .glass-card .text-3xl {
                font-size: 1.25rem !important;
            }

            .glass-card p {
                font-size: 0.75rem !important;
            }

            /* Compact form */
            #registerForm {
                gap: 12px !important;
            }

            .space-y-1\.5 {
                gap: 4px !important;
            }

            /* Compact role selector */
            [class*="bg-"][class*="/50"] {
                padding: 4px !important;
            }

            [class*="bg-"][class*="/50"] label div {
                padding: 8px !important;
                font-size: 0.75rem !important;
            }

            input {
                font-size: 16px !important;
                padding: 12px 12px 12px 40px !important;
            }

            /* Compact button */
            button[type="submit"] {
                padding: 12px !important;
                margin-top: 4px !important;
            }

            /* Smaller terms text */
            form p {
                font-size: 0.65rem !important;
            }

            [class*="blur-"] {
                display: none !important;
            }
        }

        /* Tablets */
        @media (min-width: 641px) and (max-width: 1024px) {
            .glass-card {
                max-width: 420px !important;
                padding: 32px !important;
            }
        }

        /* Desktop */
        @media (min-width: 1025px) {
            .glass-card {
                max-width: 480px !important;
            }
        }
    </style>
</head>

<body
    class="bg-background-dark text-white min-h-screen flex flex-col relative overflow-x-hidden font-display selection:bg-primary selection:text-background-dark">
    <!-- Background Elements -->
    <div class="fixed inset-0 z-0 bg-cyber-gradient"></div>
    <div class="fixed inset-0 z-0 cyber-grid"></div>
    <!-- Ambient glow orbs -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/20 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-[#0f0f1e] rounded-full blur-[100px]"></div>
        <div class="absolute top-[40%] right-[20%] w-[30%] h-[30%] bg-primary/10 rounded-full blur-[80px]"></div>
    </div>
    <!-- Main Layout -->
    <div class="relative z-10 flex min-h-screen w-full flex-col items-center justify-center p-4 sm:p-6 lg:p-8">
        <!-- Language Switcher -->
        <button id="langBtn"
            class="absolute top-4 right-4 glass-card px-3 py-1.5 rounded-lg flex items-center gap-2 hover:bg-white/10 transition-colors z-50">
            <span id="langIcon">🌐</span>
            <span id="langText" class="text-xs font-bold text-gray-300">EN</span>
        </button>
        <!-- Navbar Minimal -->
        <header class="absolute top-0 left-0 right-0 flex items-center justify-between px-6 py-6 md:px-12">
            <div class="flex items-center gap-3">
                <div
                    class="flex items-center justify-center size-10 rounded-lg bg-primary/10 border border-primary/20 text-primary">
                    <span class="material-symbols-outlined text-2xl">rocket_launch</span>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-white hidden sm:block" data-i18n="appName">Waking Up
                </h1>
            </div>
            <a class="text-sm font-medium text-gray-400 hover:text-primary transition-colors duration-200" href="#"
                data-i18n="helpCenter">Help
                Center</a>
        </header>
        <!-- Registration Card -->
        <div class="glass-card w-full max-w-[480px] rounded-xl p-8 sm:p-10 flex flex-col gap-8 animate-fade-in-up">
            <!-- Header -->
            <div class="flex flex-col gap-2 text-center">
                <h2 class="text-3xl font-black tracking-tight text-white neon-text" data-i18n="createAccount">Create
                    Account</h2>
                <p class="text-gray-400 text-sm font-medium" data-i18n="joinSubtitle">Start your morning routine. Select
                    your role to begin.</p>
            </div>
            <!-- Role Selector (Segmented Button) -->
            <div class="w-full">
                <div class="relative flex w-full p-1 bg-[#0f0f1e]/50 rounded-lg border border-white/5">
                    <label class="flex-1 text-center cursor-pointer relative z-10">
                        <input checked="" class="peer sr-only" name="role" type="radio" value="parent" />
                        <div
                            class="py-2.5 px-4 rounded-md text-sm font-semibold text-gray-400 transition-all duration-300 peer-checked:text-background-dark peer-checked:bg-primary peer-checked:shadow-[0_0_15px_rgba(16,183,127,0.4)]">
                            <span data-i18n="parentMode">Parent Mode</span>
                        </div>
                    </label>
                    <label class="flex-1 text-center cursor-pointer relative z-10">
                        <input class="peer sr-only" name="role" type="radio" value="child" />
                        <div
                            class="py-2.5 px-4 rounded-md text-sm font-semibold text-gray-400 transition-all duration-300 peer-checked:text-background-dark peer-checked:bg-primary peer-checked:shadow-[0_0_15px_rgba(16,183,127,0.4)]">
                            <span data-i18n="childMode">Child Mode</span>
                        </div>
                    </label>
                </div>
            </div>
            <!-- Form -->
            <form id="registerForm" class="flex flex-col gap-5">
                <!-- Full Name Input -->
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-gray-300 uppercase tracking-wider ml-1"
                        data-i18n="fullName">Full Name</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span
                                class="material-symbols-outlined text-gray-500 group-focus-within:text-primary transition-colors">person</span>
                        </div>
                        <input id="regName"
                            class="w-full bg-[#0f0f1e]/60 border border-white/10 text-white text-sm rounded-lg block pl-10 p-3.5 placeholder-gray-500 focus:outline-none focus:border-primary input-glow transition-all duration-200"
                            placeholder="Enter your full name" data-i18n="enterFullName" type="text" />
                    </div>
                </div>
                <!-- Username Input -->
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-gray-300 uppercase tracking-wider ml-1"
                        data-i18n="username">Username</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span
                                class="material-symbols-outlined text-gray-500 group-focus-within:text-primary transition-colors">badge</span>
                        </div>
                        <input id="regUsername"
                            class="w-full bg-[#0f0f1e]/60 border border-white/10 text-white text-sm rounded-lg block pl-10 p-3.5 placeholder-gray-500 focus:outline-none focus:border-primary input-glow transition-all duration-200"
                            placeholder="Choose your username" data-i18n="chooseUsername" type="text" />
                    </div>
                </div>
                <!-- Father's Name Input (for child linking) -->
                <div id="fatherNameContainer" class="space-y-1.5 hidden">
                    <label class="text-xs font-bold text-gray-300 uppercase tracking-wider ml-1"><span
                            data-i18n="fathersName">Father's Name</span> <span class="text-gray-500"
                            data-i18n="forChildrenOnly">(for children only)</span></label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span
                                class="material-symbols-outlined text-gray-500 group-focus-within:text-primary transition-colors">family_restroom</span>
                        </div>
                        <input id="regFatherName"
                            class="w-full bg-[#0f0f1e]/60 border border-white/10 text-white text-sm rounded-lg block pl-10 p-3.5 placeholder-gray-500 focus:outline-none focus:border-primary input-glow transition-all duration-200"
                            placeholder="Enter father's registered name" type="text" />
                    </div>
                </div>
                <!-- Password Input -->
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-gray-300 uppercase tracking-wider ml-1"
                        data-i18n="password">Password</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span
                                class="material-symbols-outlined text-gray-500 group-focus-within:text-primary transition-colors">lock</span>
                        </div>
                        <input id="regPassword"
                            class="w-full bg-[#0f0f1e]/60 border border-white/10 text-white text-sm rounded-lg block pl-10 p-3.5 placeholder-gray-500 focus:outline-none focus:border-primary input-glow transition-all duration-200"
                            placeholder="Create a secure key" data-i18n="createSecureKey" type="password" />
                    </div>
                </div>
                <!-- Submit Button -->
                <button
                    class="mt-2 w-full bg-primary hover:bg-[#0ea06f] text-background-dark font-bold py-3.5 px-4 rounded-lg transition-all duration-200 shadow-[0_0_20px_rgba(16,183,127,0.3)] hover:shadow-[0_0_25px_rgba(16,183,127,0.5)] transform hover:-translate-y-0.5 flex items-center justify-center gap-2 group"
                    type="submit">
                    <span data-i18n="createAccount">Create Account</span>
                    <span
                        class="material-symbols-outlined group-hover:translate-x-1 transition-transform text-lg">arrow_forward</span>
                </button>
                <div id="regErrorMessage"
                    class="hidden text-red-400 text-sm text-center mt-2 bg-red-500/10 p-2 rounded"></div>
                <div id="regSuccessMessage"
                    class="hidden text-green-400 text-sm text-center mt-2 bg-green-500/10 p-2 rounded"></div>
                <!-- Terms -->
                <p class="text-xs text-center text-gray-500 px-4 leading-relaxed">
                    <span data-i18n="terms">By accessing the system, you agree to our</span> <a
                        class="text-primary hover:underline" href="#" data-i18n="termsOfService">Terms of
                        Service</a> & <a class="text-primary hover:underline" href="#"
                        data-i18n="privacyProtocols">Privacy Protocols</a>.
                </p>
            </form>
            <!-- Login Link -->
            <div class="text-center mt-4">
                <p class="text-sm text-gray-400"><span data-i18n="alreadyHaveAccount">Already have an account?</span> <a
                        class="text-primary font-bold hover:text-white transition-colors ml-1" href="login.html"
                        data-i18n="login">Log
                        in</a></p>
            </div>
        </div>
    </div>
    </div>
    <script type="module" src="js/auth-pages.js"></script>
</body>

</html>
