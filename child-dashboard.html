<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Child Dashboard - Standing Detection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1 class="title">
                    <span class="title-icon">👁️</span>
                    Child Dashboard
                </h1>
                <div class="header-actions">
                    <span class="user-name" id="userName">Child</span>
                    <button class="logout-btn" id="logoutBtn">Logout</button>
                </div>
            </div>
        </header>
        
        <div class="video-wrapper">
            <div class="video-border"></div>
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
            
            <!-- Status Indicator Ring -->
            <div class="status-ring" id="statusRing"></div>
            
            <!-- Status Overlay -->
            <div class="status-overlay" id="statusOverlay">
                <div class="status-card" id="statusCard">
                    <div class="status-icon" id="statusIcon">⏳</div>
                    <div class="status-text" id="statusText">Initializing...</div>
                    <div class="status-subtext" id="statusSubtext">Please wait</div>
                </div>
            </div>
        </div>
        
        <!-- Decorative particles -->
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
    </div>

    <!-- MediaPipe Pose -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <!-- App Modules -->
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/pose-detector.js"></script>
    <script type="module" src="js/standing-detector.js"></script>
    <script type="module" src="js/clothing-detector.js"></script>
    <script type="module" src="js/ui-controller.js"></script>
    <script type="module" src="js/records.js"></script>
    <script type="module" src="js/child-dashboard.js"></script>
</body>
</html>
