<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Login - Waking Up</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#10b77f",
                        "background-light": "#f6f8f7",
                        "background-dark": "#10221c",
                        "navy-deep": "#0f0f1e",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px" },
                    boxShadow: {
                        'glow': '0 0 20px -5px rgba(16, 183, 127, 0.5)',
                        'glow-lg': '0 0 40px -10px rgba(16, 183, 127, 0.4)',
                    }
                },
            },
        }
    </script>
    <style>
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #10221c;
        }

        ::-webkit-scrollbar-thumb {
            background: #23483c;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #10b77f;
        }

        .glass-card {
            background: rgba(15, 25, 35, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .input-glass {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .input-glass:focus {
            background: rgba(16, 183, 127, 0.05);
            border-color: #10b77f;
            box-shadow: 0 0 0 1px #10b77f, 0 0 15px rgba(16, 183, 127, 0.3);
        }

        .cyber-grid {
            background-size: 40px 40px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
    </style>
</head>

<body
    class="font-display antialiased text-white bg-navy-deep min-h-screen flex flex-col relative overflow-x-hidden selection:bg-primary selection:text-white">
    <!-- Background Ambience -->
    <div class="fixed inset-0 z-0 pointer-events-none">
        <!-- Deep Navy Base -->
        <div class="absolute inset-0 bg-[#0f0f1e]"></div>
        <!-- Cyber Grid Overlay -->
        <div class="absolute inset-0 cyber-grid opacity-30"></div>
        <!-- Ambient Glows -->
        <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-primary/20 blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-purple-900/20 blur-[120px]">
        </div>
        <div
            class="absolute top-[40%] left-[50%] transform -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary/10 rounded-full blur-[100px] opacity-60">
        </div>
    </div>
    <!-- Main Layout -->
    <div class="relative z-10 flex flex-col items-center justify-center min-h-screen p-4 sm:p-6 lg:p-8">
        <!-- Brand Logo Area -->
        <div class="mb-8 flex flex-col items-center">
            <div
                class="w-12 h-12 rounded-xl bg-gradient-to-br from-primary to-emerald-800 flex items-center justify-center shadow-glow mb-4">
                <span class="material-symbols-outlined text-white text-3xl">wb_sunny</span>
            </div>
            <h1 class="text-xl font-bold tracking-wider text-white/90 uppercase">Waking Up</h1>
        </div>
        <!-- Glass Card -->
        <div
            class="glass-card w-full max-w-[480px] rounded-2xl shadow-2xl p-6 sm:p-10 flex flex-col gap-6 ring-1 ring-white/10">
            <!-- Header Section -->
            <div class="flex flex-col gap-2 text-center">
                <p class="text-white text-3xl font-black leading-tight tracking-[-0.02em]">Welcome Back</p>
                <p class="text-gray-400 text-sm font-normal leading-normal">Sign in to manage your family's routine.</p>
            </div>
            <!-- Role Switcher -->
            <div class="bg-black/40 p-1 rounded-xl flex items-center justify-center relative border border-white/5">
                <div class="grid grid-cols-2 w-full gap-1">
                    <label class="cursor-pointer group">
                        <input checked="" class="peer sr-only" name="role" type="radio" value="Parent" />
                        <div
                            class="flex items-center justify-center gap-2 py-2.5 rounded-lg text-sm font-medium text-gray-400 transition-all duration-300 peer-checked:bg-primary peer-checked:text-white peer-checked:shadow-lg">
                            <span class="material-symbols-outlined text-[18px]">admin_panel_settings</span>
                            <span>Parent</span>
                        </div>
                    </label>
                    <label class="cursor-pointer group">
                        <input class="peer sr-only" name="role" type="radio" value="Child" />
                        <div
                            class="flex items-center justify-center gap-2 py-2.5 rounded-lg text-sm font-medium text-gray-400 transition-all duration-300 peer-checked:bg-primary peer-checked:text-white peer-checked:shadow-lg">
                            <span class="material-symbols-outlined text-[18px]">child_care</span>
                            <span>Child</span>
                        </div>
                    </label>
                </div>
            </div>
            <!-- Form -->
            <form id="loginForm" class="flex flex-col gap-5 mt-2">
                <!-- Father's Name Input (Hidden by default, for Child login) -->
                <div id="fatherNameContainer"
                    class="hidden p-3 bg-primary/10 rounded-lg border border-primary/20 animate-fade-in-up">
                    <label class="text-xs font-bold text-primary uppercase tracking-wider mb-1 block">Father's
                        Name</label>
                    <div class="relative group">
                        <span
                            class="absolute left-3 top-1/2 -translate-y-1/2 text-primary material-symbols-outlined">family_restroom</span>
                        <input id="loginFatherName"
                            class="w-full bg-black/20 border border-primary/30 text-white text-sm rounded-lg block pl-10 p-2.5 placeholder-gray-500 focus:outline-none focus:border-primary transition-all"
                            placeholder="Enter father's registered name" type="text" />
                    </div>
                </div>
                <!-- Username Field -->
                <div class="flex flex-col gap-2">
                    <label id="usernameLabel" class="text-sm font-medium text-gray-300 ml-1">Username</label>
                    <div class="relative group">
                        <span
                            class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 transition-colors group-focus-within:text-primary material-symbols-outlined">person</span>
                        <input id="loginUsername"
                            class="input-glass w-full rounded-xl py-3.5 pl-12 pr-4 text-white placeholder:text-gray-600 focus:outline-0 focus:ring-0 text-base"
                            placeholder="Enter your username" type="text" />
                    </div>
                </div>
                <!-- Password Field -->
                <div class="flex flex-col gap-2">
                    <div class="flex justify-between items-center ml-1">
                        <label class="text-sm font-medium text-gray-300">Password</label>
                        <a class="text-xs text-primary hover:text-emerald-400 transition-colors" href="#">Forgot
                            password?</a>
                    </div>
                    <div class="relative group">
                        <span
                            class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 transition-colors group-focus-within:text-primary material-symbols-outlined">lock</span>
                        <input id="loginPassword"
                            class="input-glass w-full rounded-xl py-3.5 pl-12 pr-12 text-white placeholder:text-gray-600 focus:outline-0 focus:ring-0 text-base"
                            placeholder="Enter your password" type="password" />
                        <button
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white transition-colors"
                            type="button">
                            <span class="material-symbols-outlined text-[20px]">visibility</span>
                        </button>
                    </div>
                </div>
                <!-- Main Action -->
                <button
                    class="w-full bg-primary hover:bg-emerald-500 text-[#0f1915] font-bold text-base py-3.5 rounded-xl shadow-glow hover:shadow-glow-lg transition-all duration-300 transform active:scale-[0.98] mt-2 flex items-center justify-center gap-2">
                    <span>Log In</span>
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
                </button>
                <div id="loginErrorMessage"
                    class="hidden text-red-500 text-sm text-center mt-2 bg-red-500/10 p-2 rounded">
                </div>
            </form>
            <!-- Footer Sign Up -->
            <div class="text-center mt-4">
                <p class="text-gray-400 text-sm">
                    Don't have an account?
                    <a class="text-primary hover:text-emerald-400 font-semibold transition-colors"
                        href="register.html">Sign
                        up now</a>
                </p>
            </div>
        </div>
        <!-- Bottom copyright/links -->
        <div class="mt-8 text-center">
            <p class="text-gray-600 text-xs">
                © 2023 Smart Morning Assistant. <a class="hover:text-gray-400 underline" href="#">Privacy</a> &amp; <a
                    class="hover:text-gray-400 underline" href="#">Terms</a>.
            </p>
        </div>
    </div>
    </div>
    <script type="module" src="js/auth-pages.js"></script>
</body>

</html>
