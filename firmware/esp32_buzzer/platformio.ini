; PlatformIO Project Configuration File for ESP32 Buzzer Controller (HTTPS Version)
; 
; This firmware supports HTTPS to allow communication from GitHub Pages (HTTPS)
; Uses esp32_https_server library for SSL/TLS support

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Libraries required for HTTPS server
lib_deps = 
    bblanchon/ArduinoJson@^6.21.3
    fhessel/esp32_https_server@^1.0.0

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=1

; Upload settings - adjust port as needed
; upload_port = COM3
; monitor_port = COM3
